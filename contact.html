<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="聯絡婚禮攝影師 Karina，分享你們的故事與婚禮計畫。">
    <title>Contact — Karina</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='47' font-family='serif' font-size='48' text-anchor='middle' fill='%23fff'%3EK%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Pinyon+Script&family=Viaoda+Libre&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="animations.css">
    <script src="animations.js" defer></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: "DM Sans", sans-serif;
        background: #000;
        color: #fff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #000;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        display: flex;
        width: min(100% - 96px, 1440px);
        align-items: center;
        justify-content: space-between;
        margin: 0 auto;
        padding: 34px 0;
      }

      .wordmark {
        font-family: "Viaoda Libre", serif;
        font-size: 1.65rem;
        letter-spacing: 0.06em;
      }

      .site-nav {
        display: flex;
        gap: clamp(22px, 4vw, 56px);
        align-items: center;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
      }

      .site-nav a {
        padding: 8px 0;
        transition: opacity 180ms ease;
      }

      .site-nav a[aria-current="page"] {
        border-bottom: 1px solid currentColor;
      }

      .site-nav a:hover,
      .site-nav a:focus-visible {
        opacity: 0.65;
      }

      .contact {
        width: min(100% - 48px, 600px);
        margin: 0 auto;
        padding: clamp(64px, 10vw, 128px) 0 clamp(80px, 12vw, 152px);
      }

      .contact-heading {
        margin-bottom: clamp(42px, 7vw, 72px);
        text-align: center;
      }

      .contact-heading h1 {
        margin: 0;
        font-family: "Viaoda Libre", serif;
        font-size: clamp(3.5rem, 9vw, 6rem);
        font-weight: 400;
        line-height: 1;
      }

      .contact-heading p {
        margin: 16px 0 0;
        font-family: "Pinyon Script", cursive;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        font-style: italic;
      }

      .contact-form {
        display: grid;
        gap: 34px;
      }

      .contact-form input,
      .contact-form textarea {
        width: 100%;
        padding: 14px 0;
        border: 0;
        border-bottom: 1px solid #fff;
        border-radius: 0;
        outline: none;
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: 0.95rem;
        transition: border-color 180ms ease;
      }

      .contact-form input::placeholder,
      .contact-form textarea::placeholder {
        color: rgb(255 255 255 / 55%);
        opacity: 1;
      }

      .contact-form input:focus,
      .contact-form textarea:focus {
        border-bottom-width: 2px;
        color: #fff;
      }

      .contact-form textarea {
        min-height: 130px;
        resize: vertical;
      }

      .submit-button {
        justify-self: center;
        min-width: 180px;
        margin-top: 12px;
        padding: 15px 28px;
        border: 1px solid #fff;
        background: #fff;
        color: #000;
        font: inherit;
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        cursor: pointer;
        transition: background-color 200ms ease, color 200ms ease;
      }

      .submit-button:hover,
      .submit-button:focus-visible {
        background: #000;
        color: #fff;
      }

      .form-message {
        min-height: 1.5em;
        margin: -14px 0 0;
        text-align: center;
        font-size: 0.9rem;
        line-height: 1.6;
      }

      .instagram-link {
        display: grid;
        width: 28px;
        height: 28px;
        margin: 42px auto 0;
        place-items: center;
        color: #fff;
        transition: opacity 180ms ease;
      }

      .instagram-link:hover,
      .instagram-link:focus-visible {
        opacity: 0.65;
      }

      .instagram-link svg {
        display: block;
        width: 22px;
        height: 22px;
        fill: currentColor;
      }

      .site-footer {
        padding: 26px 24px 32px;
        border-top: 1px solid rgb(255 255 255 / 20%);
        text-align: center;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
      }

      @media (max-width: 700px) {
        .site-header {
          width: min(100% - 40px, 560px);
          flex-direction: column;
          gap: 20px;
          padding: 24px 0;
        }

        .site-nav {
          width: 100%;
          justify-content: center;
          gap: clamp(18px, 6vw, 34px);
          font-size: 0.68rem;
        }

        .contact {
          width: min(100% - 40px, 560px);
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="Karina 首頁">Karina</a>
      <nav class="site-nav" aria-label="主要導覽">
        <a href="index.html">首頁</a>
        <a href="gallery.html">作品集</a>
        <a href="about.html">關於</a>
        <a href="contact.html" aria-current="page">聯繫</a>
      </nav>
    </header>

    <main>
      <section class="contact" aria-labelledby="contact-title">
        <div class="contact-heading">
          <h1 id="contact-title">聯繫</h1>
          <p>I'd love to hear your story</p>
        </div>

        <h2>分享你們的故事</h2>
        <form class="contact-form" id="contact-form">
          <input type="text" name="name" autocomplete="name" placeholder="姓名" aria-label="姓名" required>
          <input type="email" name="email" autocomplete="email" placeholder="信箱" aria-label="信箱" required>
          <textarea name="message" placeholder="留言" aria-label="留言" required></textarea>
          <button class="submit-button" type="submit">送出訊息</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <a class="instagram-link" href="https://www.instagram.com/" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9Zm4.5 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.25-3.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Z"/>
          </svg>
        </a>
      </section>
    </main>

    <footer class="site-footer">KARINA WEDDING PHOTOGRAPHY</footer>

    <script>
      const contactForm = document.querySelector("#contact-form");
      const formMessage = document.querySelector("#form-message");

      contactForm.addEventListener("submit", (event) => {
        event.preventDefault();
        formMessage.textContent = "謝謝。我會盡快與您聯繫。";
        contactForm.reset();
      });
    </script>
  </body>
</html>
