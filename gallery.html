<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="瀏覽 Karina 的婚禮攝影作品集，以黑白影像珍藏每一段愛的故事。">
    <title>Gallery — Karina</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='47' font-family='serif' font-size='48' text-anchor='middle' fill='%23fff'%3EK%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Pinyon+Script&family=Viaoda+Libre&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="animations.css">
    <script src="animations.js" defer></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: "DM Sans", sans-serif;
        background: #000;
        color: #fff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: #000;
      }

      body.is-locked {
        overflow: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        display: flex;
        width: min(100% - 96px, 1440px);
        align-items: center;
        justify-content: space-between;
        margin: 0 auto;
        padding: 34px 0;
      }

      .wordmark {
        font-family: "Viaoda Libre", serif;
        font-size: 1.65rem;
        letter-spacing: 0.06em;
      }

      .site-nav {
        display: flex;
        gap: clamp(22px, 4vw, 56px);
        align-items: center;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
      }

      .site-nav a {
        padding: 8px 0;
        transition: opacity 180ms ease;
      }

      .site-nav a[aria-current="page"] {
        border-bottom: 1px solid currentColor;
      }

      .site-nav a:hover,
      .site-nav a:focus-visible {
        opacity: 0.65;
      }

      .gallery-heading {
        padding: clamp(54px, 9vw, 112px) 24px clamp(48px, 7vw, 84px);
        text-align: center;
      }

      .gallery-heading h1 {
        margin: 0;
        font-family: "Viaoda Libre", serif;
        font-size: clamp(3.5rem, 9vw, 7rem);
        font-weight: 400;
        line-height: 1;
      }

      .gallery-heading p {
        margin: 16px 0 0;
        font-family: "Pinyon Script", cursive;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        font-style: italic;
      }

      .gallery {
        width: min(100% - 96px, 1440px);
        margin: 0 auto;
        padding-bottom: clamp(80px, 12vw, 160px);
        columns: 3;
        column-gap: 20px;
      }

      .gallery-item {
        display: block;
        width: 100%;
        margin: 0 0 20px;
        padding: 0;
        overflow: hidden;
        border: 0;
        background: transparent;
        cursor: zoom-in;
        break-inside: avoid;
      }

      .gallery-item img {
        display: block;
        width: 100%;
        height: auto;
        filter: grayscale(1);
        transition: opacity 220ms ease, transform 500ms ease;
      }

      .gallery-item:hover img,
      .gallery-item:focus-visible img {
        opacity: 0.78;
        transform: scale(1.025);
      }

      .site-footer {
        padding: 26px 24px 32px;
        border-top: 1px solid rgb(255 255 255 / 20%);
        text-align: center;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
      }

      .lightbox {
        position: fixed;
        z-index: 10;
        display: grid;
        visibility: hidden;
        padding: 72px 80px;
        place-items: center;
        background: rgb(0 0 0 / 94%);
        opacity: 0;
        transition: opacity 240ms ease, visibility 240ms ease;
        inset: 0;
      }

      .lightbox.is-open {
        visibility: visible;
        opacity: 1;
      }

      .lightbox-image {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        filter: grayscale(1);
        opacity: 0;
        transform: scale(0.98);
        transition: opacity 240ms ease, transform 320ms ease;
      }

      .lightbox.is-open .lightbox-image {
        opacity: 1;
        transform: scale(1);
      }

      .lightbox-control {
        position: absolute;
        display: grid;
        width: 48px;
        height: 48px;
        padding: 0;
        place-items: center;
        border: 0;
        background: transparent;
        color: #fff;
        cursor: pointer;
        opacity: 0.85;
        transition: opacity 180ms ease;
      }

      .lightbox-control:hover,
      .lightbox-control:focus-visible {
        opacity: 0.6;
      }

      .lightbox-close {
        top: 20px;
        right: 24px;
        font-family: "DM Sans", sans-serif;
        font-size: 2rem;
        font-weight: 400;
        line-height: 1;
      }

      .lightbox-prev,
      .lightbox-next {
        top: 50%;
        font-family: "DM Sans", sans-serif;
        font-size: 2.5rem;
        font-weight: 400;
        transform: translateY(-50%);
      }

      .lightbox-prev {
        left: 20px;
      }

      .lightbox-next {
        right: 20px;
      }

      @media (max-width: 900px) {
        .gallery {
          columns: 2;
        }

        .lightbox {
          padding: 72px 64px;
        }
      }

      @media (max-width: 700px) {
        .site-header,
        .gallery {
          width: min(100% - 40px, 560px);
        }

        .site-header {
          flex-direction: column;
          gap: 20px;
          padding: 24px 0;
        }

        .site-nav {
          width: 100%;
          justify-content: center;
          gap: clamp(18px, 6vw, 34px);
          font-size: 0.68rem;
        }

        .gallery {
          columns: 1;
        }

        .lightbox {
          padding: 64px 18px;
        }

        .lightbox-prev {
          left: 4px;
        }

        .lightbox-next {
          right: 4px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="Karina 首頁">Karina</a>
      <nav class="site-nav" aria-label="主要導覽">
        <a href="index.html">首頁</a>
        <a href="gallery.html" aria-current="page">作品集</a>
      <a href="about.html">關於</a>
      <a href="contact.html">聯繫</a>
      </nav>
    </header>

    <main>

      <section class="gallery" aria-labelledby="gallery-stories-title">

        <button class="gallery-item" type="button" data-full="https://picsum.photos/id/1011/1600/1200" aria-label="放大作品 1">
          <img src="https://picsum.photos/id/1011/900/675" alt="黑白婚禮攝影作品 1" width="900" height="675" fetchpriority="high">

        <button class="gallery-item" type="button" data-full="https://picsum.photos/id/1012/1200/1600" aria-label="放大作品 2">

        </button>
        <button class="gallery-item" type="button" data-full="https://picsum.photos/id/1015/900/1200" aria-label="放大作品 3">
          <img src="https://picsum.photos/id/1015/675/900" alt="黑白婚禮攝影作品 3" width="675" height="900" loading="lazy">
        </button>
        <button class="gallery-item" type="button" data-full="https://picsum.photos/id/1025/1600/1200" aria-label="放大作品 4">
          <img src="https://picsum.photos/id/1025/900/675" alt="黑白婚禮攝影作品 4" width="900" height="675" loading="lazy">
        </button>
        <button class="gallery-item" type="button" data-full="https://picsum.photos/id/1035/1200/1600" aria-label="放大作品 5">
          <img src="https://picsum.photos/id/1035/675/900" alt="黑白婚禮攝影作品 5" width="675" height="900" loading="lazy">
        </button>
        <button class="gallery-item" type="button" data-full="https://picsum.photos/id/1040/1600/1200" aria-label="放大作品 6">
          <img src="https://picsum.photos/id/1040/900/675" alt="黑白婚禮攝影作品 6" width="900" height="675" loading="lazy">
        </button>
        <button class="gallery-item" type="button" data-full="https://picsum.photos/id/1062/1200/1600" aria-label="放大作品 7">

        <button class="gallery-item" type="button" data-full="https://picsum.photos/id/1084/1200/1600" aria-label="放大作品 9">

      </section>
    </main>

    <footer class="site-footer">KARINA WEDDING PHOTOGRAPHY</footer>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="作品照片檢視器" aria-hidden="true" inert>
      <button class="lightbox-control lightbox-close" type="button" aria-label="關閉照片">×</button>
      <button class="lightbox-control lightbox-prev" type="button" aria-label="上一張照片">‹</button>
      <img class="lightbox-image" src="" alt="">
      <button class="lightbox-control lightbox-next" type="button" aria-label="下一張照片">›</button>
    </div>

    <script>
      const galleryItems = Array.from(document.querySelectorAll(".gallery-item"));
      const lightbox = document.querySelector("#lightbox");
      const lightboxImage = document.querySelector(".lightbox-image");
      const closeButton = document.querySelector(".lightbox-close");
      const previousButton = document.querySelector(".lightbox-prev");
      const nextButton = document.querySelector(".lightbox-next");
      let activeIndex = 0;
      let previouslyFocusedElement = null;

      function showImage(index) {
        activeIndex = (index + galleryItems.length) % galleryItems.length;
        const item = galleryItems[activeIndex];
        lightboxImage.src = item.dataset.full;
        lightboxImage.alt = item.querySelector("img").alt;
      }

      function openLightbox(index) {
        previouslyFocusedElement = document.activeElement;
        showImage(index);
        lightbox.inert = false;
        lightbox.setAttribute("aria-hidden", "false");
        lightbox.classList.add("is-open");
        document.body.classList.add("is-locked");
        closeButton.focus();
      }

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        lightbox.inert = true;
        document.body.classList.remove("is-locked");
        lightboxImage.src = "";
        if (previouslyFocusedElement) {
          previouslyFocusedElement.focus();
        }
      }

      galleryItems.forEach((item, index) => {
        item.addEventListener("click", () => openLightbox(index));
      });

      closeButton.addEventListener("click", closeLightbox);
      previousButton.addEventListener("click", () => showImage(activeIndex - 1));
      nextButton.addEventListener("click", () => showImage(activeIndex + 1));

      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (lightbox.inert) {
          return;
        }

        if (event.key === "Escape") {
          closeLightbox();
        } else if (event.key === "ArrowLeft") {
          showImage(activeIndex - 1);
        } else if (event.key === "ArrowRight") {
          showImage(activeIndex + 1);
        }
      });
    </script>
  </body>
</html>
